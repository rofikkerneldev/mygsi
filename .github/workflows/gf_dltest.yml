name: Test GoFile Download

on:
  workflow_dispatch:
    inputs:
      gofile_link:
        description: "GoFile public link"
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests

      - name: Download GoFile
        env:
          GOFILE_LINK: ${{ inputs.gofile_link }}
        run: |
          rm -rf original_download
          mkdir -p original_download

          echo "======================================"
          echo "GoFile URL:"
          echo "$GOFILE_LINK"
          echo "======================================"

          python3 gofile_dl.py \
            "$GOFILE_LINK" \
            -o original_download/firmware.zip

      - name: Show Downloaded Files
        run: |
          echo "======================================"
          echo "Downloaded files:"
          echo "======================================"

          find original_download -type f -exec ls -lh {} \;

          echo
          echo "Disk usage:"
          du -sh original_download

      - name: Verify Firmware
        run: |
          FILE="original_download/firmware.zip"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: firmware.zip not found!"
            exit 1
          fi

          echo "File:"
          ls -lh "$FILE"

          echo
          echo "File type:"
          file "$FILE"

          echo
          echo "Testing ZIP..."
          unzip -t "$FILE"
