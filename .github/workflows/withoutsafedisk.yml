name: RofikKernelDev

on:
  workflow_dispatch:
    inputs:
      firmware_link:
        description: 'Stock Firmware Link (Direct Download/Wget)'
        required: true
      rom_type:
        description: 'ROM Type'
        required: true
        type: choice
        options:
          - Generic
          - Pixel
          - MIUIGeneric
          - HyperOS
          - HMD
          - OneUI
          - HiOS

jobs:
  RofikKernelDev:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false # We handle this manually 


      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unace unrar zip unzip p7zip-full p7zip-rar sharutils rar uudeview mpack arj cabextract rename liblzma-dev python3-pip brotli lz4 protobuf-compiler git gawk jq
          
      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install protobuf==3.20.3 gdown
          
          
      - name: Install Python Dependencies
        run: |
          python3 -m pip install backports.lzma bsdiff4 twrpdtgen extract-dtb pycryptodome
      - name: Prepare and Clean URL
        id: prep
        run: |
          LINK="${{ inputs.firmware_link }}"
          if [[ "$LINK" == *"google.com/url"* ]]; then
             LINK=$(echo "$LINK" | grep -oP 'q=\K[^&]*' | python3 -c "import sys, urllib.parse; print(urllib.parse.unquote(sys.stdin.read().strip()))")
          fi
          echo "url=$LINK" >> $GITHUB_OUTPUT

      - name: Download Firmware
        id: download
        run: |
         LINK="${{ steps.prep.outputs.url }}"
         
         mkdir -p original_download
          if [[ "$LINK" == *"drive.google.com"* ]]; then
            echo "Google Drive detected."

            FILEID=$(echo "$LINK" | sed -n 's#.*file/d/\([^/]*\).*#\1#p')

            if [[ -z "$FILEID" ]]; then
              echo "Cannot parse Google Drive File ID!"
              exit 1
            fi

            echo "Downloading from Google Drive..."

            # Let gdown determine the real filename
            cd original_download
            gdown "$FILEID"

            DOWNLOADED_FILE=$(find . -maxdepth 1 -type f | head -n 1)

            if [[ -z "$DOWNLOADED_FILE" ]]; then
              echo "Failed to find downloaded firmware!"
              exit 1
            fi

            ORIGINAL_FILENAME=$(basename "$DOWNLOADED_FILE")

            cd ..

            mv "original_download/$ORIGINAL_FILENAME" firmware.zip

          else
            echo "Direct download detected."

            # First ask the server for the real filename
            ORIGINAL_FILENAME=$(curl -L -s -D - -o /dev/null "$LINK" \
              | grep -i '^content-disposition:' \
              | sed -n 's/.*filename\*=[^;]*'\'''\''\([^;]*\).*/\1/p' \
              | sed 's/\r$//' \
              | python3 -c 'import sys, urllib.parse; x=sys.stdin.read().strip(); print(urllib.parse.unquote(x))' || true)

            # Fallback to normal filename from URL
            if [[ -z "$ORIGINAL_FILENAME" ]]; then
              ORIGINAL_FILENAME=$(basename "${LINK%%\?*}")
            fi

            # Remove possible query/encoding artifacts
            ORIGINAL_FILENAME=$(python3 -c "import urllib.parse; print(urllib.parse.unquote('''$ORIGINAL_FILENAME'''))")

            echo "Original filename: $ORIGINAL_FILENAME"

            wget --progress=bar:force:noscroll -O firmware.zip "$LINK"
          fi

          echo "======================================"
          echo "Original firmware: $ORIGINAL_FILENAME"
          echo "Saved locally as: firmware.zip"
          echo "======================================"

          echo "original_filename=$ORIGINAL_FILENAME" >> "$GITHUB_OUTPUT"
          
      - name: Make all scripts executable
        run: |
          find . -type f -name "*.sh" -exec chmod +x {} \;
          
      - name: Run rofikkernel
        run: |
          chmod +x LinkToGSI.sh
          bash LinkToGSI.sh "$(pwd)/firmware.zip" "${{ inputs.rom_type }}"

      - name: rofikkerneloke
        env:
          GOFILE_API_KEY: ${{ secrets.GOFILE_API_KEY }}
        run: |
          sudo chown -R $USER:$USER .
          ORIGINAL_FILENAME="${{ steps.download.outputs.original_filename }}"

          # Remove the original extension
          ROM_BASENAME="${ORIGINAL_FILENAME%.*}"

          # Rename generated system.zip
          OUTPUT_FILE="Output/${ROM_BASENAME}-rofikkerneldev.zip"

          echo "Original firmware : $ORIGINAL_FILENAME"
          echo "Generated GSI     : $OUTPUT_FILE"

          mv "Output/system.zip" "$OUTPUT_FILE"

          bash uploadgofile.sh "$OUTPUT_FILE"
        
          
