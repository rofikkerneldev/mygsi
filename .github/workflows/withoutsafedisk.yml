name: RofikKernelDev

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: 'Firmware Source'
        required: true
        type: choice
        options:
          - Google Drive
          - GoFile
          - Telegram
          - Direct URL
          
      firmware_link:
        description: 'Firmware Link'
        required: true
        type: string
      rom_type:
        description: 'ROM Type'
        required: true
        type: choice
        options:
          - Generic
          - Pixel
          - MIUIGeneric
          - HyperOS
          - HMD
          - OneUI
          - HiOS

jobs:
  RofikKernelDev:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false # We handle this manually 


      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unace unrar zip unzip p7zip-full p7zip-rar sharutils rar uudeview mpack arj cabextract rename liblzma-dev python3-pip brotli lz4 protobuf-compiler git gawk jq
          
      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install protobuf==3.20.3 gdown
          
          
      - name: Install Python Dependencies
        run: |
          python3 -m pip install backports.lzma bsdiff4 twrpdtgen extract-dtb pycryptodome requests
      - name: Prepare and Clean URL
        id: prep
        run: |
          LINK="${{ inputs.firmware_link }}"
 
          # Resolve Google redirect URL
          if [[ "$LINK" == *"google.com/url"* ]]; then
          LINK=$(echo "$LINK" \
          | grep -oP 'q=\K[^&]*' \
          | python3 -c "import sys, urllib.parse; print(urllib.parse.unquote(sys.stdin.read().strip()))")
          fi

          echo "Source:"
          echo "${{ inputs.source_type }}"

          echo "Final URL:"
          echo "$LINK"

          echo "url=$LINK" >> "$GITHUB_OUTPUT"

      - name: Download Firmware
  id: download
  run: |
    SOURCE="${{ inputs.source_type }}"
    LINK="${{ steps.prep.outputs.url }}"

    rm -rf original_download
    mkdir -p original_download

    echo "======================================"
    echo "Firmware Downloader"
    echo "======================================"
    echo "Source: $SOURCE"
    echo "Link  : $LINK"
    echo "======================================"

    # ============================================================
    # GOOGLE DRIVE
    # ============================================================
    if [[ "$SOURCE" == "Google Drive" ]]; then

      echo "Google Drive detected."

      FILEID=""

      if [[ "$LINK" == *"drive.usercontent.google.com"* ]]; then

        FILEID=$(python3 -c "
        import urllib.parse
        url = '''$LINK'''
        query = urllib.parse.parse_qs(
            urllib.parse.urlparse(url).query
        )
        print(query.get('id', [''])[0])
        ")

              else

        FILEID=$(echo "$LINK" \
          | sed -n 's#.*file/d/\([^/?]*\).*#\1#p')

        if [[ -z "$FILEID" ]]; then
          FILEID=$(python3 -c "
        import urllib.parse
        url = '''$LINK'''
        query = urllib.parse.parse_qs(
            urllib.parse.urlparse(url).query
        )
        print(query.get('id', [''])[0])
        ")
        fi

      fi

      if [[ -z "$FILEID" ]]; then
        echo "ERROR: Cannot parse Google Drive File ID!"
        echo "URL: $LINK"
        exit 1
      fi

      echo "Google Drive File ID: $FILEID"
      echo "Downloading with gdown..."

      cd original_download

      gdown "$FILEID"

      DOWNLOADED_FILE=$(find . -maxdepth 1 -type f -print -quit)

      if [[ -z "$DOWNLOADED_FILE" ]]; then
        echo "ERROR: gdown did not download any file!"
        exit 1
      fi

      ORIGINAL_FILENAME=$(basename "$DOWNLOADED_FILE")

      echo "Original filename: $ORIGINAL_FILENAME"

      cd ..

      mv \
        "original_download/$ORIGINAL_FILENAME" \
        firmware.zip


    # ============================================================
    # GOFILE
    # ============================================================
    elif [[ "$SOURCE" == "GoFile" ]]; then

      echo "GoFile detected."
      echo "Using custom GoFile downloader..."

      python3 gofile_dl.py \
        "$LINK" \
        -o firmware.zip

      if [[ ! -f firmware.zip ]]; then
        echo "ERROR: GoFile downloader did not create firmware.zip!"
        exit 1
      fi

      # gofile_dl.py already gets the original filename.
      # We extract it from the JSON/API output through a helper
      # file if available.

      if [[ ! -f gofile_filename.txt ]]; then
      echo "ERROR: GoFile filename metadata not found!"
        exit 1
     fi

     ORIGINAL_FILENAME=$(cat gofile_filename.txt)

     if [[ -z "$ORIGINAL_FILENAME" ]]; then
       echo "ERROR: GoFile filename is empty!"
       exit 1
     fi

     echo "Original filename: $ORIGINAL_FILENAME"

      echo "Original filename: $ORIGINAL_FILENAME"


    # ============================================================
    # TELEGRAM
    # ============================================================
    elif [[ "$SOURCE" == "Telegram" ]]; then

      echo "Telegram detected."

      rm -rf Output
      mkdir -p Output

      TG_API_ID="${{ secrets.TG_API_ID }}" \
      TG_API_HASH="${{ secrets.TG_API_HASH }}" \
      TG_SESSION="${{ secrets.TG_SESSION }}" \
      TELEGRAM_LINK="$LINK" \
      python3 tg_dl.py

      DOWNLOADED_FILE=$(find Output -type f -print -quit)

      if [[ -z "$DOWNLOADED_FILE" ]]; then
        echo "ERROR: Telegram downloader did not produce a file!"
        exit 1
      fi

      ORIGINAL_FILENAME=$(basename "$DOWNLOADED_FILE")

      echo "Original filename: $ORIGINAL_FILENAME"

      mv \
        "$DOWNLOADED_FILE" \
        firmware.zip


    # ============================================================
    # DIRECT URL
    # ============================================================
    elif [[ "$SOURCE" == "Direct URL" ]]; then

      echo "Direct download detected."

      ORIGINAL_FILENAME=$(curl -L -s -D - -o /dev/null "$LINK" \
        | grep -i '^content-disposition:' \
        | sed -n 's/.*filename\*=[^;]*'\'''\''\([^;]*\).*/\1/p' \
        | sed 's/\r$//' \
        | python3 -c '
import sys
import urllib.parse

x = sys.stdin.read().strip()
print(urllib.parse.unquote(x))
' || true)

      if [[ -z "$ORIGINAL_FILENAME" ]]; then
        ORIGINAL_FILENAME=$(basename "${LINK%%\?*}")
      fi

      ORIGINAL_FILENAME=$(python3 -c "
import urllib.parse
print(urllib.parse.unquote('''$ORIGINAL_FILENAME'''))
")

      echo "Original filename: $ORIGINAL_FILENAME"

      wget \
        --progress=bar:force:noscroll \
        -O firmware.zip \
        "$LINK"


    else

      echo "ERROR: Unknown source type: $SOURCE"
      exit 1

    fi


    # ============================================================
    # RESULT
    # ============================================================

    if [[ ! -f firmware.zip ]]; then
      echo "ERROR: firmware.zip was not created!"
      exit 1
    fi

    FILE_SIZE=$(stat -c%s firmware.zip)

    echo "======================================"
    echo "Download complete"
    echo "======================================"
    echo "Source           : $SOURCE"
    echo "Original firmware: $ORIGINAL_FILENAME"
    echo "Saved locally as : firmware.zip"
    echo "File size        : $FILE_SIZE bytes"
    echo "======================================"

    if [[ "$FILE_SIZE" -eq 0 ]]; then
      echo "ERROR: firmware.zip is empty!"
      exit 1
    fi

    # Prevent accidentally continuing with HTML
    if file firmware.zip | grep -qiE 'HTML|text'; then
      echo "ERROR: Downloaded file appears to be HTML!"
      file firmware.zip
      exit 1
    fi

    echo "original_filename=$ORIGINAL_FILENAME" >> "$GITHUB_OUTPUT"
          
      - name: Make all scripts executable
        run: |
          find . -type f -name "*.sh" -exec chmod +x {} \;
          
      - name: Run rofikkernel
        run: |
          chmod +x LinkToGSI.sh
          bash LinkToGSI.sh "$(pwd)/firmware.zip" "${{ inputs.rom_type }}"

      - name: rofikkerneloke
        env:
          GOFILE_API_KEY: ${{ secrets.GOFILE_API_KEY }}
        run: |
          sudo chown -R $USER:$USER .
          ORIGINAL_FILENAME="${{ steps.download.outputs.original_filename }}"

          # Remove the original extension
          ROM_BASENAME="${ORIGINAL_FILENAME%.*}"

          # Rename generated system.zip
          OUTPUT_FILE="Output/${ROM_BASENAME}-rofikkerneldev.zip"

          echo "Original firmware : $ORIGINAL_FILENAME"
          echo "Generated GSI     : $OUTPUT_FILE"

          mv "Output/system.zip" "$OUTPUT_FILE"

          bash uploadgofile.sh "$OUTPUT_FILE"
        
          
